<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User Management - Brewed Tales Coffee Management System">
    <title>User Management - Brewed Tales</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/styles/main.css">
</head>
<body>
    <!-- Header Section -->
    <header class="site-header">
        <div class="container">
            <h1>Brewed Tales</h1>
            <nav>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="users.html">Users</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="orders.html">Orders</a></li>
                    <li><a href="login.html">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h2>User Management</h2>
                <button class="btn btn-primary" onclick="showCreateUserModal()">Create User</button>
            </div>

            <!-- User Listing -->
            <section class="user-list">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Last Login</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>admin</td>
                            <td>Admin</td>
                            <td>2024-03-15 10:30</td>
                            <td class="actions">
                                <a href="user-details.html?id=1" class="btn btn-secondary">View</a>
                                <button class="btn btn-primary" onclick="showEditUserModal(1)">Edit</button>
                                <button class="btn btn-danger" onclick="confirmDeleteUser(1)">Delete</button>
                            </td>
                        </tr>
                        <tr>
                            <td>john.doe</td>
                            <td>Regular</td>
                            <td>2024-03-14 15:45</td>
                            <td class="actions">
                                <a href="user-details.html?id=2" class="btn btn-secondary">View</a>
                                <button class="btn btn-primary" onclick="showEditUserModal(2)">Edit</button>
                                <button class="btn btn-danger" onclick="confirmDeleteUser(2)">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <!-- Create User Modal -->
    <div id="createUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New User</h3>
            </div>
            <form id="createUserForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="regular">Regular</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideModal('createUserModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit User</h3>
            </div>
            <form id="editUserForm">
                <div class="form-group">
                    <label for="editUsername">Username</label>
                    <input type="text" id="editUsername" name="username" required>
                </div>
                <div class="form-group">
                    <label for="editRole">Role</label>
                    <select id="editRole" name="role" required>
                        <option value="regular">Regular</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="hideModal('editUserModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 Brewed Tales. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Show/Hide Modal Functions
        function showModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function hideModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function showCreateUserModal() {
            showModal('createUserModal');
        }

        function showEditUserModal(userId) {
            // In a real application, you would fetch user data here
            showModal('editUserModal');
        }

        function confirmDeleteUser(userId) {
            if (confirm('Are you sure you want to delete this user?')) {
                // Handle user deletion
                console.log('Deleting user:', userId);
            }
        }

        // Form Submission Handlers
        document.getElementById('createUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Handle form submission
            hideModal('createUserModal');
        });

        document.getElementById('editUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Handle form submission
            hideModal('editUserModal');
        });
    </script>
</body>
</html>
