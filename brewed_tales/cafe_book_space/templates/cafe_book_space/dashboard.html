{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <h1>Interactive Dashboard</h1>

    <!-- Графік 1: Топ клієнтів -->
    <h2>Top Customers by Orders</h2>
    <iframe src="/static/charts/top_customers_bar_chart.html" width="100%" height="600px"></iframe>

    <!-- Графік 2: Найпопулярніші книги -->
    <h2>Most Popular Books by Total Sold</h2>
    <iframe src="/static/charts/most_popular_books_pie_chart.html" width="100%" height="600px"></iframe>

    <!-- Графік 3: Топ напоїв за середньою ціною -->
    <h2>Top Cafe Items by Average Price</h2>
    <iframe src="/static/charts/top_drinks_bar_chart.html" width="100%" height="600px"></iframe>

    <!-- Графік 4: Клієнти з великими замовленнями книг -->
    <h2>Customers with Large Book Orders</h2>
    <iframe src="/static/charts/customers_scatter_chart.html" width="100%" height="600px"></iframe>

    <!-- Графік 5: Останні замовлення -->
    <h2>Recent Orders</h2>
    <iframe src="/static/charts/recent_orders_line_chart.html" width="100%" height="600px"></iframe>

    <!-- Графік 6: Замовлення з книгами та напоями -->
    <h2>Orders with Books and Drinks</h2>
    <iframe src="/static/charts/orders_with_books_and_drinks_chart.html" width="100%" height="600px"></iframe>
    
</body>
</html>
